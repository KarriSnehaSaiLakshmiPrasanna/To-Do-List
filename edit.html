<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Task</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
<div class="add-box">
<h1>✏️ Edit Task</h1>
<form method="POST">
<input type="text" name="title" value="{{ task['title'] }}" required>
<textarea name="description">{{ task['description'] or '' }}</textarea>
<div class="form-grid">
<div><label>📅 Due Date:</label><input type="date" name="due_date" value="{{ task['due_date'] or '' }}"></div>
<div><label>⏰ Task Time:</label><input type="time" name="scheduled_time" value="{{ task['scheduled_time'] or '' }}"><small>Example: 9:30 AM or 9:30 PM</small></div>
<div><label>🎯 Difficulty:</label>
<select name="difficulty">
<option value="easy" {% if task['difficulty']=='easy' %}selected{% endif %}>😊 Easy</option>
<option value="moderate" {% if task['difficulty']=='moderate' %}selected{% endif %}>😐 Moderate</option>
<option value="hard" {% if task['difficulty']=='hard' %}selected{% endif %}>🔥 Hard</option>
</select></div>
<div><label>⏱️ Time Taken:</label><input type="number" name="time_taken" min="0" value="{{ task['time_taken'] or 0 }}"><small>Time in minutes</small></div>
</div>
<button type="submit">💾 Save Changes</button>
</form>
<br><a href="{{ url_for('index') }}" class="back">← Back to Tasks</a>
</div>
</div>
</body>
</html>
